name: Validate reordered manual compaction fix

"on":
  push:
    branches:
      - "agent/reorder-manual-compaction-base"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic patch
        run: python3 scripts/reorder-manual-compaction-pr.py

      - name: Check and run focused compaction tests
        run: |
          npm run check
          npm --prefix packages/coding-agent test -- test/suite/agent-session-compaction.test.ts test/suite/regressions/674-headless-compaction-continuation.test.ts

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/reorder-manual-compaction-pr.py
          rm .github/workflows/reorder-manual-compaction-pr.yml
          git diff --check

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(coding-agent): restore scheduler after manual compaction"
          git push origin HEAD:${GITHUB_REF_NAME}
