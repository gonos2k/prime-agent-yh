name: Temporary workspace export

on:
  push:
    branches:
      - agent/compaction-semantic-safety

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: compaction-workspace
          path: .
          include-hidden-files: true
          retention-days: 1
