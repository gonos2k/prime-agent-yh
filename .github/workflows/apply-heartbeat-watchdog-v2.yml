name: Apply corrected heartbeat watchdog

on:
  push:
    branches:
      - fix/heartbeat-dispatch-watchdog
    paths:
      - .github/workflows/apply-heartbeat-watchdog-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/heartbeat-dispatch-watchdog
          fetch-depth: 0

      - name: Apply corrected watchdog patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          staged = Path('.github/workflows/apply-heartbeat-watchdog.yml')
          workflow = staged.read_text()
          match = re.search(r"          python3 - <<'PY'\n(.*?)\n          PY\n", workflow, re.S)
          if not match:
              raise SystemExit('could not extract staged patch')
          exec(compile(textwrap.dedent(match.group(1)), str(staged), 'exec'))

          daemon = Path('packages/coding-agent/src/modes/daemon/daemon-mode.ts')
          text = daemon.read_text()
          old = '''\t\t\tawait session.followUp(runnableJob.prompt, undefined, {
          \t\t\t\tresumeIfIdle: true,
          \t\t\t\tsignal,
          \t\t\t});'''
          new = '''\t\t\tawait session.followUp(runnableJob.prompt, undefined, {
          \t\t\t\tresumeIfIdle: true,
          \t\t\t});'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one queued follow-up signal')
          daemon.write_text(text.replace(old, new))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build and check
        run: |
          npm run build
          npm run check

      - name: Run watchdog regressions
        working-directory: packages/coding-agent
        run: npx vitest --run test/cron-jobs.test.ts test/daemon-mode.test.ts

      - name: Commit source and tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/src/core/cron-jobs.ts
          git add packages/coding-agent/src/modes/daemon/daemon-mode.ts
          git add packages/coding-agent/test/cron-jobs.test.ts
          git add packages/coding-agent/test/daemon-mode.test.ts
          git commit -m "fix(coding-agent): bound scheduled-job dispatches"
          git push origin HEAD:fix/heartbeat-dispatch-watchdog
