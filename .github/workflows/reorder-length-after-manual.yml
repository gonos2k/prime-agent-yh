name: Validate reordered length continuation

"on":
  push:
    branches:
      - "agent/reorder-length-after-manual"

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'chore validate reordered length fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reapply validated length continuation commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick 693c9281f6a31137cea3546e71ffad16692297d7

      - name: Install dependencies
        run: npm ci

      - name: Check and run focused lifecycle tests
        run: |
          npm run check
          npm --prefix packages/coding-agent test -- test/agent-session-length-continuation.test.ts test/suite/agent-session-compaction.test.ts test/suite/regressions/674-headless-compaction-continuation.test.ts

      - name: Push validated reordered commit
        run: git push origin HEAD:${GITHUB_REF_NAME}
