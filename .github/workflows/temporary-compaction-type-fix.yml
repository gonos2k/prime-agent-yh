name: Temporary compaction type fix

on:
  push:
    branches:
      - agent/compaction-semantic-safety

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compaction-semantic-safety
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch content types
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/coding-agent/src/core/compaction/summary-safety.ts")
          text = path.read_text()
          replacements = {
              'import type { AssistantMessage } from "@earendil-works/pi-ai";':
                  'import type { AssistantMessage, ImageContent, TextContent } from "@earendil-works/pi-ai";',
              '.filter((block): block is { type: "text"; text: string } => block.type === "text")':
                  '.filter((block): block is TextContent => block.type === "text")',
              'function contentText(content: string | Array<{ type: string; text?: string }>): string {':
                  'function contentText(content: string | (TextContent | ImageContent)[]): string {',
              '.filter((content): content is { type: "text"; text: string } => content.type === "text")':
                  '.filter((content): content is TextContent => content.type === "text")',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing patch target: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - run: npm ci
      - run: npm run check

      - name: Run focused compaction tests
        working-directory: packages/coding-agent
        run: >-
          npx tsx ../../node_modules/vitest/dist/cli.js --run
          test/compaction-summary-safety.test.ts
          test/compaction-summary-reasoning.test.ts

      - name: Commit validated fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-compaction-type-fix.yml
          git add packages/coding-agent/src/core/compaction/summary-safety.ts
          git diff --cached --check
          git commit -m "fix(coding-agent): type compaction text content"
          git push origin HEAD:agent/compaction-semantic-safety
