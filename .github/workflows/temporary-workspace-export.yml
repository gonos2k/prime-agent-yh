name: Temporary compaction safety validation

on:
  push:
    branches:
      - agent/compaction-semantic-safety

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compaction-semantic-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply staged patch
        run: |
          git apply --check .github/compaction-safety.patch
          git apply .github/compaction-safety.patch
      - name: Install dependencies
        run: npm ci
      - name: Check formatting, lint, and types
        run: npm run check
      - name: Run focused compaction tests
        working-directory: packages/coding-agent
        run: >-
          npx tsx ../../node_modules/vitest/dist/cli.js --run
          test/compaction-summary-safety.test.ts
          test/compaction-summary-reasoning.test.ts
      - name: Verify change scope
        shell: bash
        run: |
          git diff --check
          while IFS= read -r path; do
            case "$path" in
              packages/coding-agent/CHANGELOG.md|\
              packages/coding-agent/src/core/compaction/compaction.ts|\
              packages/coding-agent/src/core/compaction/index.ts|\
              packages/coding-agent/src/core/compaction/summary-safety.ts|\
              packages/coding-agent/test/compaction-summary-reasoning.test.ts|\
              packages/coding-agent/test/compaction-summary-safety.test.ts)
                ;;
              *)
                echo "Unexpected modified path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only)
      - name: Commit validated change
        shell: bash
        run: |
          rm .github/compaction-safety.patch
          rm .github/workflows/temporary-workspace-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/coding-agent/CHANGELOG.md
          git add packages/coding-agent/src/core/compaction/compaction.ts
          git add packages/coding-agent/src/core/compaction/index.ts
          git add packages/coding-agent/src/core/compaction/summary-safety.ts
          git add packages/coding-agent/test/compaction-summary-reasoning.test.ts
          git add packages/coding-agent/test/compaction-summary-safety.test.ts
          git add -u .github/compaction-safety.patch
          git add -u .github/workflows/temporary-workspace-export.yml
          git commit -m "fix(coding-agent): make compaction summaries fail closed"
          git push origin HEAD:agent/compaction-semantic-safety
