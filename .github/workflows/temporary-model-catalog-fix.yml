name: Temporary model catalog fixture validation

on:
  push:
    branches:
      - agent/compaction-semantic-safety

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compaction-semantic-safety
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update removed Gemini fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("packages/ai/test/context-overflow.test.ts"),
              Path("packages/ai/test/total-tokens.test.ts"),
          ]
          for path in paths:
              text = path.read_text()
              if "gemini-2.0-flash" not in text:
                  raise SystemExit(f"missing model fixture in {path}")
              path.write_text(text.replace("gemini-2.0-flash", "gemini-2.5-flash"))
          PY

      - run: npm ci
      - run: npm --prefix packages/ai run generate-models
      - run: npm run check

      - name: Run focused AI tests
        working-directory: packages/ai
        run: >-
          npx tsx ../../node_modules/vitest/dist/cli.js --run
          test/context-overflow.test.ts
          test/total-tokens.test.ts

      - name: Commit validated fixtures and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-model-catalog-fix.yml
          git add packages/ai/test/context-overflow.test.ts packages/ai/test/total-tokens.test.ts
          git diff --cached --check
          git commit -m "test(ai): update Google model fixtures"
          git push origin HEAD:agent/compaction-semantic-safety
